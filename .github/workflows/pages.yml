name: Deploy site (docs LP + app) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "attributes/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは 1 本に絞る (進行中はキャンセルしない)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build_site.py は PyYAML のみ必要 (jsonschema 不要)。
      - run: pip install pyyaml
      # attributes/ から site/data.json を生成してから配信する。
      # (コミット済みファイルへの依存をなくし、環境差でデプロイが落ちないようにする)
      - run: python scripts/build_site.py
      # 配信物を組み立てる: docs/ (LP) をルート、site/ (カタログ/診断アプリ) を /app/ に。
      # 1 アーティファクトに統合することで、docs と site のデプロイ競合を防ぐ。
      - run: |
          mkdir -p dist/app
          cp -r docs/. dist/
          cp -r site/. dist/app/
      - uses: actions/configure-pages@v5
        with:
          # Pages 未有効でもワークフロー側で自動有効化する (手動設定不要)。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
