name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "attributes/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは 1 本に絞る (進行中はキャンセルしない)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build_site.py は PyYAML のみ必要 (jsonschema 不要)。
      - run: pip install pyyaml
      # site/data.json が attributes/ と同期しているか検証。
      - run: python scripts/build_site.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
