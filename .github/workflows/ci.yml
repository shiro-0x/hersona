# PR / push 時の品質ゲート (lint + schema 検証 + テスト)。
#
# publish.yml が公開を担うのに対し、本ワークフローは「壊れたものを main に入れない」
# ための門番。ローカルの開発ゲート (ruff / scripts/validate.py / pytest) と同一手順を
# 自動実行する。
#
# setup-uv が python-version ごとに専用の venv を作成・有効化するため、`uv sync` で
# その venv に依存を入れ、各ステップは `uv run` でその venv 上で実行する
# (`uv pip install --system` は externally-managed interpreter で失敗するため使わない)。
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (project + dev)
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Validate attribute schema
        run: uv run python scripts/validate.py
      - name: Check demo site data is up to date
        run: uv run python scripts/build_site.py --check
      - name: Check README attribute-count drift
        run: uv run python scripts/check_readme_counts.py
      - name: Tests (pytest)
        run: uv run pytest -q
