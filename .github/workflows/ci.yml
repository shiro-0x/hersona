# PR / push 時の品質ゲート (lint + schema 検証 + テスト)。
#
# publish.yml が公開を担うのに対し、本ワークフローは「壊れたものを main に入れない」
# ための門番。ローカルの開発ゲート (ruff / scripts/validate.py / pytest) と同一手順を
# 自動実行する。
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev)
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check
      - name: Validate attribute schema
        run: python scripts/validate.py
      - name: Check demo site data is up to date
        run: python scripts/build_site.py --check
      - name: Tests (pytest)
        run: pytest -q
