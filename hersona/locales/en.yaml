  item: "  {name}: {attributes} (weight={weight}){note}"
  note_suffix: " — {note}"
  none: "(no presets saved yet)"
  col_name: "preset"
  col_attributes: "attributes"
  col_weight: "weight"
  col_note: "note"

load:
  header: "=== preset: {name} (weight={weight}) ==="
  conflict_warn: "⚠ conflict: {conflicts}"

preset:
