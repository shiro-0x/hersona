# hersona CLI message catalog — English (BASE / default language)
#
# Referenced by dotted key (core/i18n.tr). Keep this file and ja.yaml in sync;
# keys missing from a non-default catalog fall back to this file, then to the
# key string itself.

error:
  prefix: "Error: "
  memory_mutually_exclusive: "Error: --memory and --memory-file cannot be used together"

common:
  yes: "yes"
  no: "no"
  none: "(none)"

cli:
  description: "hersona attribute template CLI"
  lang_help: "Output language (default: en, or the HERSONA_LANG env var)"
  plain_help: "Disable rich tables/panels even when rich is installed"

help:
  list: "List available attributes"
  show: "Show attribute details"
  show_name: "Attribute name (e.g. tsundere) or <category>/<name>"
  matrix: "Dump the compatibility matrix"
  json: "Emit machine-readable JSON"
  blend: "Blend attributes into a prompt injection block"
  names: "Attribute name(s)"
  weight_blend: "Intensity (default: moderate)"
  recommend: "Diagnostic quiz -> recommendation"
  rec_answers: "Non-interactive: answers as 'distance=1,role=1'"
  rec_apply: "Also show the injection block for the recommended blend"
  rec_weight: "Intensity for --apply (default: inferred from fit score)"
  rec_explain: "Show rationale per adopted attribute / alternatives / summary"
  rec_top: "Number of candidate blends to return (default: 1)"
  rec_quiz_mode: "Quiz mode: 'v1' (linear, default) or 'v2' (decision tree)"
  rec_generate_samples: "Generate sample dialogue lines for each candidate (default: off)"
  rec_sample_count: "Number of sample lines per candidate when --generate-samples is set (default: 3)"
  preview: "Show injection block + sample phrases for a blend (no LLM required)"
  preview_count: "Number of sample phrases to show (default: 3)"
  diff: "Compare two attributes (common / only-one fields + relation)"
  diff_name: "Attribute name (e.g. tsundere) or <category>/<name>"
  suggest: "On conflict, suggest non-conflicting replacement attributes (to stderr)"
  create: "Create an attribute and save it"
  create_example: "Repeatable"
  measure: "Score intensity metrics of output text (blends without a speech attribute are skipped)"
  weight_measure: "Expected band (default: moderate)"
  measure_input: "Path to the text file to score"
  measure_text: "Text to score (inline)"
  save: "Save a blend as a reusable named preset (local)"
  save_name: "Preset name (snake_case)"
  save_note: "Optional note describing the preset"
  save_overwrite: "Overwrite an existing preset of the same name"
  presets: "List saved blend presets"
  load: "Replay a saved preset as an injection block"
  load_name: "Preset name to load"
  load_weight: "Override the saved intensity on replay"
  export: "Export a blend for other agent frameworks (LangGraph / OpenAI / ...)"
  export_format: "Output format: json (default) / messages / markdown"
  soul: "Write a blend to ~/.hermes/profiles/<name>/SOUL.md (Hermes One official spec)"
  soul_profile: "Target profile name (default: default)"
  soul_output: "Output path (default: ~/.hermes/profiles/<profile>/SOUL.md)"
  soul_name: "Display name in SOUL.md Name section (default: Libra)"
  soul_append: "Append a '## 追記' section to an existing SOUL.md"
  soul_overwrite: "Allow overwriting an existing SOUL.md"
  soul_force: "Overwrite without confirmation (CI / scripts)"
  soul_dry_run: "Print the SOUL.md content to stdout without writing"
  soul_memory: "Caller-supplied memory as JSON object (max 16 keys, 512 chars/value)"
  soul_memory_file: "Path to a UTF-8 JSON file with caller-supplied memory"
  persistent: "Persist a blend to SOUL.md and print a config.yaml block to paste (ROADMAP §⑤.1)"
  persistent_memory: "Caller-supplied memory as JSON object (max 16 keys, 512 chars/value)"
  persistent_memory_file: "Path to a UTF-8 JSON file with caller-supplied memory"
  persistent_force: "Force-overwrite an existing SOUL.md"
  persistent_without_soul: "Skip SOUL.md write (only show config.yaml block)"
  persistent_without_config: "Skip config.yaml block (only write SOUL.md)"
  persistent_yaml_output: "Write the YAML block to a file (not auto-applied to config.yaml)"
  persistent_auto_config: "Automatically write the personality entry to config.yaml (PyYAML direct edit, no hermes config set)"
  persistent_config_path: "Override config.yaml path (default: ~/.hermes/config.yaml)"
  persistent_apply: "Run 'hermes config set agent.personality <name>' to activate immediately (requires hermes CLI)"
  persistent_target: "Persistence target: hermes (default) / claude / codex / cursor / gemini"
  persistent_global: "Write to the global location (e.g. ~/.claude/CLAUDE.md) instead of the project dir"
  persistent_output: "Override the target file path (for non-hermes targets)"

list:
  header: "Available attributes ({count}):"
  category: "{category}/ ({count})"
  user_tag: " [user]"
  col_category: "category"
