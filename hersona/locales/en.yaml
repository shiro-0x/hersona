blend:
  conflict: "⚠ conflict: {conflicts}"

suggest:
  header: "suggestions to resolve conflicts:"
  item: "  {a} ⇔ {b}: drop {drop} → try: {alts}"

diff:
  header: "=== diff: {a} vs {b} ==="
