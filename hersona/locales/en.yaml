  footer: "Done: SOUL.md will auto-apply from the next session. To persist to config.yaml, paste the [1/2] block manually."
  footer_auto_config: "Done: SOUL.md and config.yaml updated. The personality will auto-apply from the next session."
  target_written: "Wrote {target} persona file: {path}"
  target_updated: "Updated {target} persona file: {path}"
  target_footer: "Done: {target} will load this persona from {path} on its next session."
  target_hermes_flags_ignored: "note: --auto-config / --apply are hermes-only and ignored for target '{target}'"

