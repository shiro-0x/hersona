  scalar_b: "  {name}: {value}"
  common: "  = common: {items}"
  only: "  + {name}: {items}"
  col_field: "field"

preview:
  header: "=== preview: {blend} (weight={weight}) ==="
  inject_header: "--- injection block ---"
  samples_header: "--- sample phrases ---"
