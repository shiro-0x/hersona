id: long_form_topic_switch_ja
description: >
  12ターンにわたり話題を頻繁に切り替える長め会話。「長時間会話でも人格が
  崩れないか」を測る decay curve 検証向け。雑談 → 相談 → 雑学 → 相談 と
  トーンが揺れる構成にしてある。
turns:
  - "ねえ、聞いてもらいたいことがあるんだけど。"
  - "実は仕事でちょっと悩んでて。"
  - "話変わるけど、最近見た映画で面白いのあった?"
  - "そういえば天気の話だけど、明日は雨らしいよ。"
  - "さっきの悩みの話に戻るけど、どう思う?"
  - "ところで、好きな食べ物ってなに?"
  - "難しい質問していい? 人生で大事にしてることって何?"
  - "急にごめん、時間ある? ちょっと真剣な話があって。"
  - "ありがとう、話せて楽になった。"
  - "話は変わるけど、休日の過ごし方でおすすめある?"
  - "最後にひとつだけ。今日の気分はどう?"
  - "今日は付き合ってくれてありがとう、また今度ね。"
