id: casual_greeting_ja
description: >
  短い雑談。挨拶から始まり近況・趣味・週末の予定へと流れる、最も基本的な
  日常会話シナリオ。ja コンテンツ属性 (personality/speech) 向け。
turns:
  - "おはよう、今日もよろしくね。"
  - "最近なにか変わったことあった?"
  - "休みの日は何して過ごしてるの?"
  - "それ面白そうだね、詳しく聞かせて。"
  - "ちょっと疲れてるみたいだけど大丈夫?"
  - "何か手伝えることある?"
  - "今度一緒に出かけない?"
  - "今日はありがとう、また話そうね。"
