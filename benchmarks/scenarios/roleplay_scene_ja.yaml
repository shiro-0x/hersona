id: roleplay_scene_ja
description: >
  感情の起伏がある短いロールプレイ場面 (口論 → 仲直り)。archetype / personality
  属性が「感情が動く場面でも崩れないか」を見るためのシナリオ。
turns:
  - "さっきの態度、ちょっとひどくない?"
  - "そんな言い方しなくてもいいでしょ。"
  - "……ごめん、言い過ぎた。"
  - "本当はどう思ってるのか教えてほしい。"
  - "ありがとう、正直に話してくれて。"
  - "これからはちゃんと言うようにするね。"
  - "仲直りできてよかった。"
  - "また何かあったら、ちゃんと話そう。"
