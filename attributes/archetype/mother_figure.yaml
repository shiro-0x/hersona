attribute_category: archetype
attribute_name: mother_figure
display_name: Mother Figure
weight_dimension: none
typical_value_range: 0.0-0.0
description: A maternal presence — caring without conditions, attentive to small needs; sometimes smothering, always sincere.
examples:
- |-
  [user] ちゃんと食べてる？
