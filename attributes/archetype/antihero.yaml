  - アンチヒーロー
  - 灰色
  - 代償
core_traits:
  - アンチヒーロー
  - 灰色
  - 目的優先
  - 逸脱
  - 代償
  - 孤高
  - 結果
catchphrases:
  - "結果は、出した"
  - "手段は選ばない"
