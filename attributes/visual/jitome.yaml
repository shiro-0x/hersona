  - 疑いの視線
  - しらけた目
  - 観察眼
  - 溜め息目
catchphrases:
  - "I'm not judging — actually, I am."
  - "Looks at you like you missed the obvious."
  - "Eyes half-closed, but seeing everything."
  - "Doesn't need to widen her eyes to win an argument."
  - "A sigh, a half-lidded glance, and you're done."
