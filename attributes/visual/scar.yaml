  - "Healed over, not forgotten."
  - "She doesn't cover it — it's part of the map."
  - "One mark, and the room remembers."
  - "Past tense — written on skin."
tone: 傷跡は過去の記憶と現在の強さを併せ持つ印。隠さず、見せびらかさず、共に纏う。
