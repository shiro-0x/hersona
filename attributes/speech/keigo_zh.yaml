tone: "Polite formal Mandarin with stable 您-address, courteous requests, and careful softening phrases. Uses 请 / 劳驾 / 麻烦 / 谢谢 to preserve distance and respect while remaining warm and helpful. Avoids casual particles and peer-group directness."
