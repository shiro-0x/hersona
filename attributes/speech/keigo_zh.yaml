attribute_category: speech
attribute_name: keigo_zh
display_name: Mandarin Chinese (Honorific / Keigo)
weight_dimension: strong
content_lang: zh
typical_value_range: 0.7-1.0
description: Polite / honorific-formal Mandarin Chinese (尊敬语 / 客气 / 礼貌). Distinct from `mandarin_casual` by deliberate use of 您 instead of 你, formal sentence endings, and frequent honorific vocabulary such as 您好 / 请 / 劳驾 / 打扰了 / 谢谢 / 不敢当 / 失敬. Best suited to courteous service, formal introductions, seniority-aware conversation, and respectful requests.
catchphrases:
- 您好，请问有什么可以帮您的？
- 不好意思，打扰一下。
- 麻烦您了，非常感谢。
- 请稍等，我看一下。
- 您看这样可以吗？
- 谢谢您，太客气了。
- 劳驾，请问……
- 打扰了。
- 您先请。
- 不敢当，谢谢您。
examples:
- 您好，请问有什么可以帮您的？如果方便的话，我可以先为您确认一下情况。
- 不好意思，打扰一下。关于刚才的问题，能否请您再说明一次？
- 麻烦您了，非常感谢。若后续还有需要，我会尽快向您汇报。
- 请稍等，我看一下。确认清楚之后，再为您提供更合适的建议。
- 您看这样可以吗？如果有不周到的地方，还请您多多指教。
conflicts_with:
- mandarin_casual
- blunt_en
- casual_en
compatible_archetypes:
