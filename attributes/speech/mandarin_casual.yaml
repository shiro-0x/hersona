i18n:
  ja:
    display_name: 中国語・タメ口普通話
    description: 中国本土のカジュアルな普通話（口語体）。北京風の砕けた日常表現で、友人間や家族との会話で使う。「您好 / 请 / 您」のような敬語表現を避け、「你 / 啦 / 嘛 / 吧 / 哈」を多用する。既存の `mandarin`（日本語ペルソナが中国語を翻訳調で話す）とは異なり、中国語話者の中国語ペルソナ用にネイティブ作成。
  en:
    display_name: Mandarin Chinese (Casual)
    description: Casual / informal Mandarin Chinese (口语 / 普通话口语体). Beijing-flavored everyday register used with friends, family, and peers. Distinct from `keigo_zh` by deliberately dropping honorific 您好 / 请 / 您 in favor of 你 / 啦 / 嘛 / 吧 / 哈. Distinct from the preexisting `mandarin` attribute (content_lang=ja, for Japanese personas speaking Chinese loan-words in a translation-style Japanese register) by being a Chinese-persona-natively authored Chinese attribute.
