attribute_category: speech
attribute_name: taiwan_mandarin
display_name: Mandarin Chinese (Taiwan / Guoyu)
weight_dimension: moderate
content_lang: zh
typical_value_range: 0.5-0.9
description: "Standard Mandarin Chinese as spoken in Taiwan (台灣華語 / 國語 / Guoyu). Distinct from `mandarin_casual` (mainland Putonghua with 你 / 啦 / 嘛 / 吧) by Taiwanese conventions — softer 你, frequent 喔 in casual statements, 不見了 instead of mainland 不在了. Distinct from `keigo_zh` (mainland polite 您 register) by typically using 你 in service contexts where mainland would use 您. Distinct from the preexisting `taiwanese` attribute (content_lang: ja, for Japanese personas speaking Chinese loan-words) by being a Chinese-persona-natively authored Chinese attribute for Taiwanese Mandarin register."
catchphrases:
- 好喔，那我們走吧。
- 你有沒有要去買便當？
- 這個不見了，你有看到嗎？
- 對啊，就是這樣。
- 還好啊，還好。
- 喔，這樣喔。
- 對不起喔，我遲到了。
- 你先走，我等一下就過去。
- 那個東西放在哪裡你知道嗎？
- 好啦好啦，不要生氣啦。
examples:
- 好喔，那我們走吧。你要不要先打個電話跟他們說一下？
- 這個不見了，你有看到嗎？我剛剛還放在桌上啊，奇怪。
- 還好啊，還好，差不多就是那樣啦。
- 對不起喔，我遲到了，下次我會早一點出門。
- 那個東西放在哪裡你知道嗎？我找半天都找不到。
conflicts_with:
- mandarin_casual
- keigo_zh
- blunt_en
compatible_archetypes:
