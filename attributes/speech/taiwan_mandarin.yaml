- taiwan
- guoyu
- standard
second_person: 你
register: neutral
lexical_markers:
- 喔
- 啦
- 啊
- 對啊
- 還好
- 對不起
- 不見了
- 這個
- 那個
- 便當
tone: "Standard Taiwanese Mandarin register. Frequent 喔 / 啦 particles for soft statements, 還好 as a common reassurance, 不見了 instead of mainland 不在了. 你 stays as the everyday second-person even in service contexts. Distinct from mainland Putonghua by the softening particles and the preference for 這 / 那 with shorthand nouns. Distinct from mainland honorific register by the avoidance of 您 outside very formal contexts."
