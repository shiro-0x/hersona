speech_style: 一人称は「うち／わし」、語尾は「や・やで・やん・ねん」、強調に「めっちゃ・ほんま」。ツッコミのテンポと距離の近さで押す。
tone: 関西弁の軽妙なテンポとツッコミ気質。距離が近く率直で、感情表現は明け透け。笑いと本音が地続き。
notes: T1 では具体方言を kansai_ben に固定。運用時に他方言へ派生可能 (variant)。
i18n:
  ja:
    display_name: 関西弁
    description: 関西圏の標準的な方言。断定の「やん」「やで」、疑問の「はる」「やろ」、強調の「めっちゃ」などを含む。
