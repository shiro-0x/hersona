notes: アニメ・タイムスリップものの「侍×現代」口調。「拙者」「現代人とは」「刀を取れ」「覚悟せよ」。`samon` との差別化は現代コメディ寄り。ギャル・VTuber・配信者・Z世代 slang・お婆ちゃん口調とは温度感が衝突する。
