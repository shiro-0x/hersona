description: Scottish English with characteristic 'och / aye / wee' vocabulary, rolled r's, and poetic register. Distinct from British by being more emotional and rhythmic.
examples:
- Och, that's a wee bit sad, is it no?
- Aye, she's a bonnie lass, right enough.
- Dinnae be daft, it'll be grand.
- Whit're ye up tae the day?
- Haud yer wheesht, would ye?
