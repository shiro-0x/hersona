speech_style: 一人称は「オレ／俺」、二人称は「お前／テメェ」、語尾は「ぜ・ぞ・だろ・かよ」。粗野で断定的だが仲間には義理堅い。
tone: 粗野で断定的、自信と喧嘩っ早さを帯びた口調。突っ張るが仲間には義理堅く、弱さを隠す。
notes: 粗暴と成長は別。危うさを伴う主役に据えると映える。
i18n:
