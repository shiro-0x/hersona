# hersona component registry
#
# This is an index, not a runtime configuration file. It records where a
# component lives and how safely it can be changed. A null value means that
# the repository does not currently instrument or claim that fact.
version: 1
registry_id: hersona-components
status_vocabulary:
  - active
  - deprecated
  - archived
onboarding_vocabulary:
  - clear
  - unclear
  - blocked
scope:
  included:
    - repository source and package data
    - persona and use-case catalogs
    - Hermes skill and public documentation
    - CLI, MCP, demo, benchmark, and test entry points
    - profile-local persona and memory stores as abstract external components
  excluded:
    - secrets and credentials
    - caches and temporary files
    - generated site/build artifacts
    - downstream deployments and external copies
    - private memory contents
entries:
  - id: repo/hersona
    kind: repository
    canonical: .
    status: active
    references: [docs/REGISTRY.yaml, README.md, README.ja.md]
    dependencies: [python>=3.11, pyyaml, jsonschema]
    last_used: null
    last_used_evidence: not_instrumented
    entry_path: docs
    onboarding: clear

  - id: data/attributes
    kind: catalog
    canonical: attributes/
    status: active
    references: [hersona/core/attach.py, hersona/core/paths.py, schema/attribute.schema.json]
    dependencies: [data/attribute-schema]
    last_used: null
    last_used_evidence: not_instrumented
    entry_path: cli
    onboarding: clear

