maintenance:
  lifecycle:
    active: maintained and safe to reference
    deprecated: retained for compatibility; new references require review
    archived: retained as history; do not use for new work
  rules:
    - Do not auto-delete entries with an unknown canonical source.
    - Do not infer last_used from file modification time.
    - Move entries through active -> deprecated -> archived; do not skip stages.
    - Keep private memory values and secrets out of this file.
    - Update this registry when a public path, schema, interface, or dependency changes.
  review_questions:
    - Is each id at the right component granularity?
    - Is the canonical source verified and non-generated?
    - Are references and dependencies observed rather than guessed?
    - Is onboarding clear, unclear, or blocked based on a reproducible path?
